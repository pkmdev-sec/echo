<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#000000"/>

  <!-- Define arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#e5e7eb" text-anchor="middle">
    ECHO Architecture Pipeline
  </text>

  <!-- Node 1: Claude Code Session -->
  <g id="node1">
    <rect x="50" y="120" width="220" height="80" rx="10" fill="#1a1a2e" stroke="#0ea5e9" stroke-width="2"/>
    <text x="160" y="155" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e5e7eb" text-anchor="middle">
      Claude Code
    </text>
    <text x="160" y="180" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">
      Session
    </text>
  </g>

  <!-- Node 2: echo-recorder.py -->
  <g id="node2">
    <rect x="370" y="120" width="220" height="80" rx="10" fill="#1a1a2e" stroke="#0ea5e9" stroke-width="2"/>
    <text x="480" y="155" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e5e7eb" text-anchor="middle">
      echo-recorder.py
    </text>
    <text x="480" y="180" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">
      (PostToolUse hook)
    </text>
  </g>

  <!-- Node 3: Sessions Store -->
  <g id="node3">
    <rect x="690" y="120" width="220" height="80" rx="10" fill="#1a1a2e" stroke="#0ea5e9" stroke-width="2"/>
    <text x="800" y="145" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e5e7eb" text-anchor="middle">
      Sessions Store
    </text>
    <text x="800" y="170" font-family="system-ui, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">
      ~/.echo/sessions/
    </text>
    <text x="800" y="190" font-family="system-ui, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">
      *.ndjson
    </text>
  </g>

  <!-- Arrows between top nodes -->
  <line x1="270" y1="160" x2="370" y2="160" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="160" x2="690" y2="160" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Node 4: ReplayEngine -->
  <g id="node4">
    <rect x="150" y="350" width="200" height="80" rx="10" fill="#1a1a2e" stroke="#0ea5e9" stroke-width="2"/>
    <text x="250" y="380" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e5e7eb" text-anchor="middle">
      ReplayEngine
    </text>
    <text x="250" y="405" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">
      Session playback
    </text>
  </g>

  <!-- Node 5: Analytics -->
  <g id="node5">
    <rect x="400" y="350" width="200" height="80" rx="10" fill="#1a1a2e" stroke="#0ea5e9" stroke-width="2"/>
    <text x="500" y="380" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e5e7eb" text-anchor="middle">
      Analytics
    </text>
    <text x="500" y="405" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">
      Metrics & insights
    </text>
  </g>

  <!-- Node 6: TeamDashboard -->
  <g id="node6">
    <rect x="650" y="350" width="200" height="80" rx="10" fill="#1a1a2e" stroke="#0ea5e9" stroke-width="2"/>
    <text x="750" y="380" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e5e7eb" text-anchor="middle">
      TeamDashboard
    </text>
    <text x="750" y="405" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">
      Visualization
    </text>
  </g>

  <!-- Node 7: ExportManager -->
  <g id="node7">
    <rect x="900" y="350" width="200" height="80" rx="10" fill="#1a1a2e" stroke="#0ea5e9" stroke-width="2"/>
    <text x="1000" y="380" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e5e7eb" text-anchor="middle">
      ExportManager
    </text>
    <text x="1000" y="405" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">
      Data export
    </text>
  </g>

  <!-- Arrows from Sessions Store to bottom nodes -->
  <line x1="740" y1="200" x2="250" y2="350" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="770" y1="200" x2="500" y2="350" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="800" y1="200" x2="750" y2="350" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="860" y1="200" x2="1000" y2="350" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Additional detail boxes -->
  <g id="detail1">
    <rect x="150" y="500" width="200" height="100" rx="8" fill="#0f0f1e" stroke="#0ea5e9" stroke-width="1" opacity="0.8"/>
    <text x="250" y="530" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0ea5e9" text-anchor="middle">
      Features
    </text>
    <text x="250" y="555" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">
      • Step-by-step replay
    </text>
    <text x="250" y="575" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">
      • Time-travel debugging
    </text>
  </g>

  <g id="detail2">
    <rect x="400" y="500" width="200" height="100" rx="8" fill="#0f0f1e" stroke="#0ea5e9" stroke-width="1" opacity="0.8"/>
    <text x="500" y="530" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0ea5e9" text-anchor="middle">
      Metrics
    </text>
    <text x="500" y="555" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">
      • Tool usage stats
    </text>
    <text x="500" y="575" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">
      • Performance analysis
    </text>
  </g>

  <g id="detail3">
    <rect x="650" y="500" width="200" height="100" rx="8" fill="#0f0f1e" stroke="#0ea5e9" stroke-width="1" opacity="0.8"/>
    <text x="750" y="530" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0ea5e9" text-anchor="middle">
      Team Insights
    </text>
    <text x="750" y="555" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">
      • Collaboration metrics
    </text>
    <text x="750" y="575" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">
      • Best practices
    </text>
  </g>

  <g id="detail4">
    <rect x="900" y="500" width="200" height="100" rx="8" fill="#0f0f1e" stroke="#0ea5e9" stroke-width="1" opacity="0.8"/>
    <text x="1000" y="530" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0ea5e9" text-anchor="middle">
      Export Formats
    </text>
    <text x="1000" y="555" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">
      • JSON, CSV, HTML
    </text>
    <text x="1000" y="575" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">
      • Custom reports
    </text>
  </g>

  <!-- Connecting lines to detail boxes -->
  <line x1="250" y1="430" x2="250" y2="500" stroke="#0ea5e9" stroke-width="1" opacity="0.5"/>
  <line x1="500" y1="430" x2="500" y2="500" stroke="#0ea5e9" stroke-width="1" opacity="0.5"/>
  <line x1="750" y1="430" x2="750" y2="500" stroke="#0ea5e9" stroke-width="1" opacity="0.5"/>
  <line x1="1000" y1="430" x2="1000" y2="500" stroke="#0ea5e9" stroke-width="1" opacity="0.5"/>

  <!-- Footer text -->
  <text x="600" y="750" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">
    Real-time recording → Persistent storage → Multi-dimensional analysis
  </text>
</svg>
