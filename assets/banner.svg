<svg width="1500" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1500" height="500" fill="#000000"/>

  <!-- Left side: Circular container with sound wave logo -->
  <g transform="translate(200, 250)">
    <!-- Outer circle container -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#0ea5e9" stroke-width="3"/>

    <!-- Sound wave ripples - concentric circles emanating outward -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="1"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.4"/>

    <!-- Central dot -->
    <circle cx="0" cy="0" r="8" fill="#0ea5e9"/>
  </g>

  <!-- Right side: Title and text content -->
  <g transform="translate(450, 180)">
    <!-- Main title "ECHO" -->
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="72" font-weight="800" fill="#0ea5e9">
      ECHO
    </text>

    <!-- Subtitle -->
    <text x="0" y="50" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#9ca3af" letter-spacing="4">
      SESSION REPLAY AND ANALYTICS
    </text>

    <!-- Description -->
    <text x="0" y="90" font-family="system-ui, sans-serif" font-size="16" fill="#6b7280">
      Every action recorded. Every session replayable.
    </text>
  </g>

  <!-- Version badge at bottom right -->
  <g transform="translate(1320, 420)">
    <!-- Pill shape background -->
    <rect x="0" y="0" width="120" height="40" rx="20" fill="none" stroke="#0ea5e9" stroke-width="2"/>

    <!-- Version text -->
    <text x="60" y="26" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#0ea5e9" text-anchor="middle">
      v1.0
    </text>
  </g>
</svg>
